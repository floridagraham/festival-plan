<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Your Festival Plan app icon: a striped sunset on a horizon grid with one laser beam per festival day
       (Friday coral, Saturday violet, Sunday cyan, the app's day theme colors). Full-bleed square so iOS
       and Android can round or mask it; everything important sits inside the central safe circle. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241466"/>
      <stop offset=".62" stop-color="#120a2e"/>
      <stop offset="1" stop-color="#0b0620"/>
    </linearGradient>
    <clipPath id="sun"><circle cx="256" cy="300" r="118"/></clipPath>
    <clipPath id="ground"><rect x="0" y="304" width="512" height="208"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <!-- beams, behind the sun -->
  <g stroke-linecap="round" stroke-width="30">
    <line x1="256" y1="300" x2="138" y2="118" stroke="#ff7a59"/>
    <line x1="256" y1="300" x2="256" y2="78" stroke="#a874ff"/>
    <line x1="256" y1="300" x2="374" y2="118" stroke="#3fe0ff"/>
  </g>
  <!-- striped half sun -->
  <g clip-path="url(#sun)">
    <rect x="130" y="182" width="252" height="44" fill="#ffcc66"/>
    <rect x="130" y="226" width="252" height="38" fill="#ff7a59"/>
    <rect x="130" y="264" width="252" height="36" fill="#ff4fb4"/>
    <rect x="130" y="238" width="252" height="7" fill="#120a2e"/>
    <rect x="130" y="270" width="252" height="10" fill="#120a2e"/>
    <rect x="130" y="290" width="252" height="10" fill="#120a2e"/>
  </g>
  <!-- horizon and perspective grid -->
  <rect x="96" y="298" width="320" height="10" rx="5" fill="#3fe0ff"/>
  <g clip-path="url(#ground)" stroke="#3fe0ff" stroke-linecap="round">
    <line x1="126" y1="338" x2="386" y2="338" stroke-width="6" opacity=".7"/>
    <line x1="150" y1="378" x2="362" y2="378" stroke-width="5" opacity=".45"/>
    <line x1="256" y1="304" x2="168" y2="400" stroke-width="5" opacity=".5"/>
    <line x1="256" y1="304" x2="256" y2="404" stroke-width="5" opacity=".5"/>
    <line x1="256" y1="304" x2="344" y2="400" stroke-width="5" opacity=".5"/>
  </g>
</svg>
